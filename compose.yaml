services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    container_name: ai-panel-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ai_panel_sql_data:/var/lib/postgresql
    networks:
      - ai-panel_network

  mongodb:
    image: mongo:9.0
    restart: unless-stopped
    container_name: ai-panel-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - ai_panel_nosql_data:/data/db
    networks:
      - ai-panel_network

networks:
  ai-panel_network:
    driver: bridge

volumes:
  ai_panel_sql_data:
  ai_panel_nosql_data: